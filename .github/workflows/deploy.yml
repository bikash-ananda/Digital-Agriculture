name: Deploy Digital Agriculture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package release
        run: |
          tar \
            --exclude=.git --exclude=node_modules --exclude='**/node_modules' \
            --exclude='**/.env' --exclude='**/.env.*' --exclude='**/dist' --exclude='**/build' \
            --exclude='**/uploads' --exclude='**/photo-work' --exclude='*DESKTOP-CA62IOU*' \
            --exclude='*-output.txt' --exclude='*.bak' --exclude='deploy-vps.sh' \
            --exclude='diag-vps.sh' --exclude='https-vps.sh' --exclude='restore-vps.sh' \
            -czf /tmp/digital-agriculture-release.tgz .
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          HOST: ${{ secrets.HOST }}
          PORT: ${{ secrets.PORT }}
        run: |
          test -n "$SSH_KEY" || { echo "Missing SSH_KEY"; exit 1; }
          test -n "$HOST" || { echo "Missing HOST"; exit 1; }
          PORT="${PORT:-22}"
          case "$PORT" in *[!0-9]*|'') echo "PORT must be a number"; exit 1 ;; esac
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/id_ed25519"
          if ! ssh-keyscan -T 10 -H -p "$PORT" "$HOST" > "$HOME/.ssh/known_hosts"; then
            echo "SSH host-key scan failed. Check HOST, PORT, and VPS firewall access from GitHub Actions."
            exit 1
          fi
          test -s "$HOME/.ssh/known_hosts" || { echo "Could not retrieve SSH host key"; exit 1; }
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload release
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
        run: |
          test -n "$HOST" && test -n "$USERNAME" || { echo "Missing HOST or USERNAME"; exit 1; }
          port="${PORT:-22}"
          scp -i "$HOME/.ssh/id_ed25519" -P "$port" -o IdentitiesOnly=yes /tmp/digital-agriculture-release.tgz "$USERNAME@$HOST:/tmp/digital-agriculture-release-$GITHUB_SHA.tgz"
      - name: Deploy and check health
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
        run: |
          port="${PORT:-22}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o IdentitiesOnly=yes "$USERNAME@$HOST" \
            "set -eu; release='/srv/digital-agriculture/releases/$GITHUB_SHA'; mkdir -p \"\$release\"; tar -xzf '/tmp/digital-agriculture-release-$GITHUB_SHA.tgz' -C \"\$release\"; rm -f '/tmp/digital-agriculture-release-$GITHUB_SHA.tgz'; bash \"\$release/scripts/deploy-release.sh\" \"\$release\""
