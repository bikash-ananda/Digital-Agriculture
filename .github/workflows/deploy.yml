name: Deploy Digital Agriculture
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Package release
        run: |
          tar \
            --exclude=.git --exclude=node_modules --exclude='**/node_modules' \
            --exclude='**/.env' --exclude='**/.env.*' --exclude='**/dist' --exclude='**/build' \
            --exclude='**/uploads' --exclude='**/photo-work' --exclude='*DESKTOP-CA62IOU*' \
            --exclude='*-output.txt' --exclude='*.bak' --exclude='deploy-vps.sh' \
            --exclude='diag-vps.sh' --exclude='https-vps.sh' --exclude='restore-vps.sh' \
            -czf /tmp/digital-agriculture-release.tgz .
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_KEY" || { echo "Missing VPS_DEPLOY_KEY"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "Missing VPS_KNOWN_HOSTS"; exit 1; }
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" || { echo "Missing VPS_HOST or VPS_USER"; exit 1; }
          port="${VPS_SSH_PORT:-22}"
          scp -i "$HOME/.ssh/id_ed25519" -P "$port" -o IdentitiesOnly=yes /tmp/digital-agriculture-release.tgz "$VPS_USER@$VPS_HOST:/tmp/digital-agriculture-release-$GITHUB_SHA.tgz"
      - name: Deploy and check health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          port="${VPS_SSH_PORT:-22}"
          ssh -i "$HOME/.ssh/id_ed25519" -p "$port" -o IdentitiesOnly=yes "$VPS_USER@$VPS_HOST" \
            "set -eu; release='/srv/digital-agriculture/releases/$GITHUB_SHA'; mkdir -p \"\$release\"; tar -xzf '/tmp/digital-agriculture-release-$GITHUB_SHA.tgz' -C \"\$release\"; rm -f '/tmp/digital-agriculture-release-$GITHUB_SHA.tgz'; bash \"\$release/scripts/deploy-release.sh\" \"\$release\""