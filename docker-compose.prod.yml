services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${DB_NAME:-digital_agriculture}
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [app]

  api:
    image: digital-agriculture-api:production
    build: ./backend
    restart: unless-stopped
    environment: &api_environment
      NODE_ENV: production
      PORT: "5000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DB_NAME: ${DB_NAME:-digital_agriculture}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      OTP_SECRET: ${OTP_SECRET:?Set OTP_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}
      FIRMWARE_DIR: /app/uploads/firmware
      EXPORT_SECRET: ${EXPORT_SECRET:?Set EXPORT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-bikashengineering100@gmail.com}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-+9779856056205}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-System Administrator}
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - ${APP_DATA_DIR:?Set APP_DATA_DIR}/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    networks: [app]

  web:
    image: digital-agriculture-web:production
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  migrate:
    image: digital-agriculture-api:production
    profiles: [tools]
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *api_environment
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  seed:
    image: digital-agriculture-api:production
    profiles: [tools]
    command: ["npm", "run", "db:seed"]
    environment: *api_environment
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

  bootstrap:
    image: digital-agriculture-api:production
    profiles: [tools]
    command: ["node", "database/create-superadmin.js", "--if-missing"]
    environment:
      <<: *api_environment
      SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks: [app]

volumes:
  db_data:
networks:
  app:
    driver: bridge