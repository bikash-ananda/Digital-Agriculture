<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123d32" />
    <meta name="description" content="Kaski Krishi — Digital Agriculture Platform for smart farming, agricultural services and farmer support in Kaski, Nepal." />
    <meta name="application-name" content="Kaski Krishi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kaski Krishi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="msapplication-TileColor" content="#123d32" />
    <link rel="icon" type="image/svg+xml" href="/icons/kaski-krishi.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (() => {
        let preference = 'auto';
        try {
          const saved = localStorage.getItem('digital-agriculture-theme');
          if (['auto', 'light', 'dark'].includes(saved)) preference = saved;
        } catch { /* Use the automatic local-time theme when storage is unavailable. */ }
        const hour = new Date().getHours();
        const theme = preference === 'auto' ? (hour >= 6 && hour < 18 ? 'light' : 'dark') : preference;
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>Kaski Krishi | Digital Agriculture Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' })
            .catch((error) => console.warn('PWA service worker registration failed:', error));
        });
      }
    </script>
  </body>
</html>
